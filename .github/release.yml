# GitHub uses this file to group pull requests in automatically generated
# release notes. The workflow already enables generate_release_notes: true.
changelog:
  categories:
    - title: "🚀 Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "bugfix"
    - title: "🛠 Maintenance"
      labels:
        - "maintenance"
        - "dependencies"
        - "documentation"
    - title: "Other Changes"
      labels:
        - "*"
