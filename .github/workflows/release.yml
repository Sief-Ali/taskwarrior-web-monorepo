name: Build and publish runtime release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taskwarrior-web-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      publish_release: ${{ steps.plan.outputs.publish_release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Decide whether to build a release
        id: plan
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            echo "version=manual-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            # Bootstrap v1.0.0 once, because this repository currently has no release.
            # Further pushes to master only publish when a new v* tag is pushed.
            if git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/v1.0.0 >/dev/null 2>&1; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "publish_release=false" >> "$GITHUB_OUTPUT"
              echo "version=v1.0.0" >> "$GITHUB_OUTPUT"
              echo "v1.0.0 already exists; skipping branch-triggered release build."
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "publish_release=true" >> "$GITHUB_OUTPUT"
              echo "version=v1.0.0" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            echo "version=skip" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned project and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime-only release files
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/build-release.sh "$RELEASE_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskwarrior-web-runtime-${{ needs.prepare.outputs.version }}
          path: |
            dist-release/taskwarrior-web-linux-x64.tar.gz
            dist-release/taskwarrior-web-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: taskwarrior-web-runtime-${{ needs.prepare.outputs.version }}
          path: dist-release

      - name: Verify release files exist
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f install.sh
          test -f dist-release/taskwarrior-web-linux-x64.tar.gz
          test -f dist-release/taskwarrior-web-linux-x64.tar.gz.sha256
          echo "All release assets are present."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Taskwarrior Web ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist-release/taskwarrior-web-linux-x64.tar.gz
            dist-release/taskwarrior-web-linux-x64.tar.gz.sha256
            install.sh